name: Build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake python3 libibverbs-dev
      - name: Compile core, mocked RDMA tests, and native verbs targets
        run: |
          cmake -S mucql -B mucql/build-ci -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMUCQL_MOCK_VERBS_TEST=ON
          cmake --build mucql/build-ci --parallel 2
          test -x mucql/build-ci/mucql_rdma_paxos
          test -x mucql/build-ci/mucql_verbs_release
      - name: Unit and mocked RDMA tests
        run: ctest --test-dir mucql/build-ci --output-on-failure
      - name: Independent TCP quorum smoke test
        run: MUCQL_BUILD_DIR="$PWD/mucql/build-ci" bash tools/test_tcp_quorum.sh
      - name: Check deployment helpers and output parsing
        run: |
          bash -n tools/apt/*.sh
          python3 -m unittest discover -s tools/apt/tests -v
          python3 -m py_compile tools/apt/*.py tools/*.py

  # No RDMA hardware is present on GitHub-hosted runners.
  # Native libibverbs compilation is NOT a substitute for an Apt hardware test.
